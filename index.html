<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Music Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; text-align: center; color: #38bdf8; }
    p { font-size: 14px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
    textarea { width: 100%; height: 90px; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #020617; color: white; resize: none; font-size: 14px; box-sizing: border-box; outline: none; }
    button { width: 100%; margin-top: 15px; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 14px; text-align: center; color: #cbd5e1; }
    audio { width: 100%; margin-top: 16px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎵 AI Music Generator</h2>
    <p>Lyrics athva song style lakho ane music banavo</p>

    <textarea id="promptInput" placeholder="Ex: energetic pop song with drums, happy vibe"></textarea>
    <button id="btn" onclick="startGeneration()">Generate Music</button>

    <div id="status"></div>
    <audio id="player" controls></audio>
  </div>

  <script>
    const API_KEY = "r8_0gW1Mug1R0EgKoQyWBK61R1st3izAZZ3nKUUe";

    async function startGeneration() {
      const prompt = document.getElementById('promptInput').value.trim();
      const status = document.getElementById('status');
      const player = document.getElementById('player');
      const btn = document.getElementById('btn');

      if (!prompt) {
        alert("Krupya prompt lakho!");
        return;
      }

      btn.disabled = true;
      player.style.display = "none";
      status.innerText = "⏳ AI song banavi rahyu che... (1-2 minute lagse)";

      try {
        const response = await fetch("https://api.replicate.com/v1/predictions", {
          method: "POST",
          headers: {
            "Authorization": `Token ${API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            version: "b05b1d413d03a621415089f6c09b60b64d14214f4e70e28f3ea7b03ae2854930",
            input: { prompt: prompt, model_version: "stereo-large" }
          })
        });

        const data = await response.json();

        if (data.error) {
          status.innerText = "Error: " + data.error;
          btn.disabled = false;
          return;
        }

        checkStatus(data.id);
      } catch (err) {
        status.innerText = "Connection error. Fari try karo.";
        btn.disabled = false;
      }
    }

    async function checkStatus(id) {
      const status = document.getElementById('status');
      const player = document.getElementById('player');
      const btn = document.getElementById('btn');

      const interval = setInterval(async () => {
        try {
          const res = await fetch(`https://api.replicate.com/v1/predictions/${id}`, {
            headers: { "Authorization": `Token ${API_KEY}` }
          });
          const result = await res.json();

          if (result.status === "succeeded") {
            clearInterval(interval);
            status.innerText = "✅ Song ready thai gayu!";
            player.src = result.output;
            player.style.display = "block";
            btn.disabled = false;
          } else if (result.status === "failed") {
            clearInterval(interval);
            status.innerText = "❌ Song banavama problem aavi.";
            btn.disabled = false;
          } else {
            status.innerText = `⏳ Processing chalu che (${result.status})...`;
          }
        } catch (e) {
          clearInterval(interval);
          status.innerText = "Status check ma issue aavyo.";
          btn.disabled = false;
        }
      }, 4000);
    }
  </script>
</body>
</html>
